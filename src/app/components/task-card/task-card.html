<article class="task-card" [class.completed]="task().completed">
  <h3>{{ task().title }}</h3>

  <p>{{ task().description }}</p>

  <span>
    @if (task().completed) {
      Completed!
    } @else {
      Not Completed
    }
  </span>

  <button (click)="toggleCompleted()" class="toggle" type="button">
    {{ task().completed ? 'Mark as Not Completed' : 'Mark as Completed' }}
  </button>

  <button (click)="removeTask()" class="remove-button" type="button">Remove Task</button>

  <button (click)="requestEdit()" class="update" type="button">Edit Task</button>
</article>

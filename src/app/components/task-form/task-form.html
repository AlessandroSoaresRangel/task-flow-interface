<form (ngSubmit)="onSubmit()">
  <label for="task-title">Title</label>
  <input id="task-title" type="text" name="title" placeholder="Task Title" [(ngModel)]="title" />

  <label for="task-description">Description</label>
  <textarea
    id="task-description"
    name="description"
    placeholder="Task Description"
    [(ngModel)]="description"
  ></textarea>
  <button type="submit">{{ taskToEdit() ? 'Save Changes' : 'Add Task' }}</button>
  @if (taskToEdit()) {
    <button type="button" (click)="editCancelled.emit()" class="cancel-edit">Cancel Edit</button>
  }
</form>
